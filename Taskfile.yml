version: '3'

tasks:
  fbs:
    desc: "Generate FlatBuffers code for C++ and Java via Python script"
    cmds:
      # 将来的に scripts/generate_fbs.py などのPythonスクリプトでラップする想定
      - flatc --cpp --java -o generated/ schemas/vram_metrics.fbs

  build-mock:
    desc: "Build C++23 engine mock (CMake)"
    dir: engine-mock
    cmds:
      - cmake -B build -S .
      - cmake --build build

  build-profiler:
    desc: "Build Vulkan profiler and engine mock"
    cmds:
      - cmake -B build -S .
      - cmake --build build

  build-reader:
    desc: "Build Java Quarkus reader"
    dir: quarkus-reader
    cmds:
      - ./gradlew build

  build-all:
    desc: "Build the profiler project"
    deps: [build-profiler]
